<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://redes-ia.org https://redes-ia.goatcounter.com; connect-src 'self' https://redes-ia.goatcounter.com; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="description" lang="es" content="{{ description_es }}">
  <meta name="description" lang="ca" content="{{ description_ca }}">
  <meta name="description" lang="en" content="{{ description_en }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:alt" content="{{ og_image_alt }}">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="ca_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <meta name="twitter:image:alt" content="{{ og_image_alt }}">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="alternate" hreflang="es" href="{{ alternate_es_url }}">
  <link rel="alternate" hreflang="ca" href="{{ alternate_ca_url }}">
  <link rel="alternate" hreflang="en" href="{{ alternate_en_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ canonical_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/logo/redes-ia-favicon.png">
  <link rel="apple-touch-icon" href="images/logo/png/redes-ia-icon.png">
  {{ stylesheets }}
  <script data-goatcounter="https://redes-ia.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  {{ structured_data }}
