name: Site checks and preview artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Rebuild shared page sections
        run: python3 scripts/build_site.py

      - name: Ensure generated pages are current
        run: git diff --exit-code -- '*.html' robots.txt sitemap.xml

      - name: Check links and basic accessibility
        run: python3 scripts/check_site.py

      - name: Package a non-publishing preview
        uses: actions/upload-artifact@v4
        with:
          name: redes-site-preview
          path: |
            *.html
            assets
            images
            CNAME
            robots.txt
            sitemap.xml
          if-no-files-found: error
